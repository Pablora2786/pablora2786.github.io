name: Refresh holders snapshot

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: holders-snapshot
  cancel-in-progress: true

jobs:
  build-holders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build holders snapshots (GraphQL)
        env:
          HOLDERS_TICKS: SUIS,MOVE,IKUN,GAME,SUIZ
          HOLDERS_PAGE_SIZE: '50'
        run: node scripts/build-holders.mjs
      - name: Commit if changed
        run: |
          git config user.name 'suicommunity'
          git config user.email 'suicommunity@users.noreply.github.com'
          git add public/holders
          if git diff --staged --quiet; then
            echo 'No holders changes'
          else
            git commit -m "chore: refresh holders snapshots"
            git push
          fi
